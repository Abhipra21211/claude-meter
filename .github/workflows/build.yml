name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch claude-counter and GeckoView version
        run: |
          D=app/src/main/assets/ext_counter
          curl -fsSL https://raw.githubusercontent.com/she-llac/claude-counter/main/userscript/claude-counter.user.js -o $D/counter.user.js
          test -s $D/counter.user.js
          cp app/src/main/assets/shim.js $D/shim.js
          echo "GM APIs used:"
          grep -oE 'GM_[A-Za-z]+|GM\.[A-Za-z]+' $D/counter.user.js | sort -u || true
          ART=""
          for A in geckoview geckoview-omni; do
            if curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/$A/maven-metadata.xml -o gv.xml; then ART=$A; break; fi
          done
          test -n "$ART"
          GV=$(grep -oE '<version>[^<]+</version>' gv.xml | tail -1 | sed -E 's/<[^>]+>//g')
          echo "GeckoView: $ART $GV"
          echo "GVA=$ART" >> $GITHUB_ENV
          echo "GV=$GV" >> $GITHUB_ENV
      - run: gradle assembleDebug --no-daemon -Pgv=$GV -Pgva=$GVA
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Claude Meter
          files: app/build/outputs/apk/debug/app-debug.apk
