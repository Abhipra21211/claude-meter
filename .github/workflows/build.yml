name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch latest claude-counter script
        run: |
          curl -fsSL https://raw.githubusercontent.com/she-llac/claude-counter/main/userscript/claude-counter.user.js -o app/src/main/assets/counter.user.js
          test -s app/src/main/assets/counter.user.js
          echo "GM APIs used:"
          grep -oE 'GM_[A-Za-z]+|GM\.[A-Za-z]+' app/src/main/assets/counter.user.js | sort -u || true
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Claude Meter
          files: app/build/outputs/apk/debug/app-debug.apk
